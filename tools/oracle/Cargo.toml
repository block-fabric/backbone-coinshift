[package]
name = "cs_oracle"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# LayerTwo-Labs/coinshift-rs ef8e914 (v0.14.8, ~/skydoge/ext/PINNED.txt); built with their Cargo.lock
coinshift = { path = "../../../ext/coinshift-rs/lib" }
bincode = "1.3.3"
borsh = "1"
serde_json = "1"
serde = "1"
hex = "0.4"
bitcoin = { version = "0.32.5", features = ["serde"] }
rustreexo = { git = "https://github.com/mit-dci/rustreexo", rev = "6da503b598470f6e87aa9d769b94df64df7ff3ae", features = ["with-serde"] }
blake3 = "1"
heed = "0.22.1"
sneed = { version = "0.0.22", features = ["observe"] }
frost-ristretto255 = { git = "https://github.com/ZcashFoundation/frost", rev = "0966bd1529aa062ad3b621af99e277f976b1c0f0", features = ["serde"] }
rand = { version = "0.10", default-features = false, features = ["chacha", "thread_rng"] }
fallible-iterator = "0.3.0"
curve25519-dalek = "5"

[profile.release]
debug = false
